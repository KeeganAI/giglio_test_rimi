services:
  db:
    image: mysql:8.0
    container_name: giglio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: giglio
      MYSQL_USER: giglio
      MYSQL_PASSWORD: giglio
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - giglio_mysql_data:/var/lib/mysql

volumes:
  giglio_mysql_data:
